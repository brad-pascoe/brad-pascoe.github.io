- title: Experience
  type: time_table
  contents:
    - title: Research Fellow
      institution: University of Southern Queensland, Springfield, QLD
      year: Jun 2025 - Present
      description:
        - Redesigned research code for vehicle codesign optimisation into modular, tested Python libraries, enabling reuse across multiple studies and improving reproducibility, numerical methods, and performance.
        - Developed a Python library for numerical computation of vehicle radiation spectra, accelerating core algorithms with Cython for high-performance evaluation.
    - title: Doctoral Candidate, Research Associate
      institution: University of Sydney, Sydney, NSW
      year: Mar 2021 - Mar 2025
      description:
        - Investigated the effects of strain on turbulent mixing layers by implementing and validating advanced numerical methods into a Fortran codebase for the solution of partial differential equations.
        - Utilised high-performance computing infrastructure using code developed for OpenMP and MPI parallelisations to simulate and analyse terabytes of data, aided by Bash and Python scripts to organise jobs and files.
        - Automated visualisations of simulated data with Python APIs, reducing time and memory usage by 20-75%.
        - Derived and calibrated reduced order models, achieving accurate predictions of fluid flow quantities for over 10,000x less computational cost compared to simulating the three-dimensional fluid flow.
    - title: Research Engineer
      institution: Defence Science and Technology Group, Melbourne, VIC
      year: Feb 2020 - Jan 2021
      description:
        - Enhanced the pre- and post-processing capabilities of multi-dimensional fatigue spectrum and strain data by developing and optimising a library in R, including introducing version control and unit tests.
        - Designed programs to read and evaluate data from fatigue testing systems, allowing for continuous verification of experimental regulatory compliance.

